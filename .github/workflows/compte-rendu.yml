name: Compte-rendu de clôture

on:
  schedule:
    # Du lundi au vendredi (heures UTC) :
    #  17h15 UTC = 18h15 à Paris en hiver (19h15 en été) : après la clôture de Paris
    #  21h30 UTC = 22h30 à Paris en hiver (23h30 en été) : après la clôture de Wall Street
    - cron: '15 17 * * 1-5'
    - cron: '30 21 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: compte-rendu
  cancel-in-progress: false

jobs:
  generer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Générer le compte-rendu
        shell: pwsh
        run: ./generer.ps1

      - name: Archiver la séance dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site/rapports site/data
          git commit -m "Compte-rendu du $(date +%F)" || echo "Rien de nouveau"
          git push

      - name: Retirer l'aperçu d'e-mail
        run: rm -f site/apercu-mail.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
